<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cadastro</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="form-container">

<h1>Criar Conta</h1>

<form id="cadastroForm">

<input
type="text"
id="nome"
placeholder="Nome"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="senha"
placeholder="Senha"
required>

<button class="btn">

Cadastrar

</button>

</form>

<p>

Já possui conta?

<a href="login.html">

Entrar

</a>

</p>

</div>

<script src="js/auth.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <h2>Entrar</h2>

        <form id="login-form">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="login-email"
                    required>

            </div>

            <div class="input-group">

                <label>Senha</label>

                <input
                    type="password"
                    id="login-password"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary full">

                Entrar

            </button>

        </form>

        <p>

            Não possui conta?

            <a href="cadastro.html">

                Criar Conta

            </a>

        </p>

        <p id="login-message"></p>

    </div>

</div>

<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
